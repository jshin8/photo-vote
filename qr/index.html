<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ZEROFUXvoting · Scan to vote</title>
    <style>
      /* Background matches the artwork's orange (#CA5220) so the cut-out blends in.
         --u scales everything so the whole page fits any screen, portrait or landscape. */
      :root {
        --bg: #ca5220;
        --u: min(1.05vw, 1.06dvh);
        color-scheme: light;
        font-family: system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: #fff;
        text-align: center;
      }
      main { display: grid; justify-items: center; gap: calc(2 * var(--u)); padding: calc(3 * var(--u)); }
      h1 { margin: 0; font-size: calc(7 * var(--u)); line-height: 1.05; letter-spacing: -0.01em; }
      .tagline { margin: 0; font-size: calc(4 * var(--u)); font-weight: 600; }

      /* Snoopy on the left, QR to his right at the same height. */
      .scene { display: flex; align-items: flex-end; gap: calc(3 * var(--u)); }
      .snoopy { display: block; height: calc(50 * var(--u)); width: auto; }
      .qr {
        position: relative;
        z-index: 1; /* keep the code above the artwork's falling leaves */
        margin-bottom: 0;
        border-radius: calc(1.5 * var(--u));
        overflow: hidden;
        box-shadow: 0 calc(0.6 * var(--u)) calc(2 * var(--u)) rgb(0 0 0 / 0.25);
      }
      .qr svg { display: block; width: calc(50 * var(--u)); height: auto; } /* same height as Snoopy */

      .url { margin: 0; font-size: max(16px, calc(2.6 * var(--u))); font-weight: 600; overflow-wrap: anywhere; }

      @media print {
        body { min-height: auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        :root { --u: 2.4mm; }
      }
    </style>
  </head>
