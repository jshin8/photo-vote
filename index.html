<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEROFUXvoting</title>
  </head>
  <body>
    <header>
      <h1>ZEROFUXvoting</h1>
      <p id="whoami" class="muted" hidden>
        Voting as <strong id="whoami-name"></strong>
        <button id="change-name" type="button" class="link">Change</button>
      </p>
    </header>

    <main>
      <p id="setup-warning" class="notice" hidden>
        Supabase isn't configured. Copy <code>.env.example</code> to <code>.env.local</code> and fill it in.
      </p>

      <section id="name-step" hidden>
        <h2>What's your name?</h2>
        <form id="name-form">
          <label>
            Your name
            <input name="name" type="text" maxlength="60" autocomplete="name" required />
          </label>
          <button type="submit">Continue</button>
        </form>
      </section>

      <nav id="tabs" class="tabs" role="tablist" aria-label="Categories" hidden>
        <button type="button" role="tab" data-category="entree">Savory</button>
        <button type="button" role="tab" data-category="dessert">Sweet</button>
      </nav>

      <section id="vote" hidden>
        <p class="status" id="vote-status" role="status"></p>
        <div id="vote-categories"></div>
      </section>

      <section id="results" hidden>
        <h2>Results</h2>
        <p class="status" id="results-status" role="status"></p>
        <div id="results-categories"></div>
      </section>
    </main>

    <dialog id="viewer" aria-label="Photo viewer">
      <button type="button" class="viewer-close" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="viewer-stage">
        <button type="button" class="viewer-nav" data-step="-1" aria-label="Previous photo"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <img alt="" />
        <button type="button" class="viewer-nav" data-step="1" aria-label="Next photo"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="viewer-bar">
        <div>
          <strong class="viewer-name"></strong>
          <span class="viewer-detail muted"></span>
        </div>
        <button type="button" class="viewer-vote"></button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
